<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRAMEAUD Lab — 同步误差实测</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 20px 80px; background: #0e1014; color: #e6e8ee;
         font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 940px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 14px; color: #9aa4bb; margin: 26px 0 10px; text-transform: uppercase; letter-spacing: .5px; }
  .sub { color: #8b93a7; font-size: 13px; margin: 0 0 22px; }
  button { background: #2b6cf6; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
           font-size: 14px; cursor: pointer; font-family: inherit; }
  button:hover { background: #3b7bff; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .stage { background: #161a22; border: 1px solid #232a36; border-radius: 10px; padding: 10px; }
  .stage canvas { display: block; border-radius: 6px; image-rendering: pixelated; }
  .stage .cap { font-size: 11px; color: #7f889c; margin-top: 6px; text-align: center; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #232a36; }
  th { color: #8b93a7; font-weight: 600; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .pass { color: #6ee7a0; }
  .fail { color: #f38b8b; }
  .warn { color: #f0c674; }
  pre { background: #11151c; border: 1px solid #232a36; border-radius: 8px; padding: 12px;
        font-size: 12px; overflow: auto; max-height: 320px; color: #b8c2d6; }
  .log { color: #7f889c; font-size: 12px; margin-top: 10px; min-height: 1.4em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FRAMEAUD Lab — 同步误差实测</h1>
  <p class="sub">
    测试素材每帧底部有一条 12 位条码，编码了帧号。JS 通过回读像素就能知道
    <b>播放器此刻真实显示的是第几帧</b>——这给了我们客观的 ground truth，
    而不用依赖「我以为它是第几帧」。
  </p>

  <div class="row">
    <div class="stage">
      <canvas id="nativeProbe" width="240" height="180"></canvas>
      <div class="cap">原生 &lt;img&gt; 回读探针</div>
    </div>
    <div class="stage">
      <canvas id="playerCanvas" width="240" height="180"></canvas>
      <div class="cap">JS 解码器输出</div>
    </div>
    <div style="flex:1; min-width:260px">
      <button id="run">运行实验</button>
      <div class="log" id="log">准备就绪</div>
    </div>
  </div>

  <h2>结果</h2>
  <table id="resultTable">
    <thead><tr><th>指标</th><th>原生 + 延迟模型 (B1)</th><th>帧锚定自绘 (P)</th></tr></thead>
    <tbody><tr><td colspan="3" style="color:#7f889c">尚未运行</td></tr></tbody>
  </table>

  <h2>原始数据 (JSON)</h2>
  <pre id="json">—</pre>
</div>

<script type="module">
import { FrameAudPlayer } from './player.js';

const W = 240, H = 180;
const BARCODE_Y = 168, BLOCK_W = 20, BITS = 12;
const GIF_URL = '../assets/demo-audio.gif';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DUR = Number(params.get('dur') || 15000);
const AUTO = params.get('auto') === '1';
const PATTERN = [80,100,120,60,140,100,90,110];
const FRAME_COUNT = 40;
const DELAYS = Array.from({ length: FRAME_COUNT }, (_, i) => PATTERN[i % PATTERN.length]);
const NOMINAL_CYCLE = DELAYS.reduce((a, b) => a + b, 0);

/* ------------------------------ 工具 ------------------------------ */

function readBarcode(g) {
  const d = g.getImageData(0, BARCODE_Y, W, 1).data;
  let v = 0;
  for (let j = 0; j < BITS; j++) {
    const px = (j * BLOCK_W + (BLOCK_W >> 1)) * 4;
    const lum = (d[px] + d[px + 1] + d[px + 2]) / 3;
    if (lum > 128) v |= (1 << j);
  }
  return v - 1; // 条码存的是 frame+1
}

function frameStartsOf(delays) {
  const s = [0];
  for (let i = 1; i < delays.length; i++) s.push(s[i - 1] + delays[i - 1]);
  return s;
}

const FRAME_STARTS = frameStartsOf(DELAYS);
const CYCLE = FRAME_STARTS[FRAME_STARTS.length - 1] + DELAYS[DELAYS.length - 1];

function frameAtTicks(t) {
  const x = ((t % CYCLE) + CYCLE) % CYCLE;
  let lo = 0, hi = FRAME_STARTS.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (FRAME_STARTS[mid] <= x) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function circDiffMs(aFrame, bFrame) {
  let d = FRAME_STARTS[aFrame] - FRAME_STARTS[bFrame];
  if (d > CYCLE / 2) d -= CYCLE;
  if (d < -CYCLE / 2) d += CYCLE;
  return d;
}

const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const pct = (a, p) => {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  return s[Math.min(s.length - 1, Math.floor(s.length * p))];
};
const r2 = n => Math.round(n * 100) / 100;

/* ------------------------- 实验 A：原生播放器 ------------------------- */

/**
 * 用「最好的估计器」对照原生播放器：
 * 以第一次观测到第 0 帧的时刻为锚点，之后完全按 GIF 声明的 delay 累加推算帧号。
 * 这是 JS 能做到的上限——因为原生播放的帧切换时刻本来就不可观测。
 */
async function runNativeTrial(durMs) {
  const img = new Image();
  img.src = GIF_URL + '?t=' + Date.now();
  await img.decode();

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });

  const t0 = performance.now();
  const samples = [];
  const cycleDurations = [];
  let prev = -1;
  let lastZero = null;
  let anchorT = null;

  await new Promise(resolve => {
    const step = () => {
      const t = performance.now() - t0;
      g.clearRect(0, 0, W, H);
      g.drawImage(img, 0, 0);
      const actual = readBarcode(g);

      if (actual >= 0 && actual < DELAYS.length) {
        if (prev >= 30 && actual === 0) {
          if (lastZero !== null) cycleDurations.push(t - lastZero);
          lastZero = t;
        }
        if (anchorT === null && t > 200 && actual === 0) anchorT = t;
        samples.push({ t, actual });
        prev = actual;
      }
      if (t < durMs) requestAnimationFrame(step); else resolve();
    };
    requestAnimationFrame(step);
  });

  // 用锚点之后的样本评估延迟模型的误差
  const evalSamples = anchorT === null ? [] : samples.filter(s => s.t > anchorT + 100);
  const errsMs = [];
  const errsFrames = [];
  for (const s of evalSamples) {
    const est = frameAtTicks(s.t - anchorT);
    if (est !== s.actual) {
      errsFrames.push(Math.min(Math.abs(est - s.actual), DELAYS.length - Math.abs(est - s.actual)));
      errsMs.push(Math.abs(circDiffMs(est, s.actual)));
    } else {
      errsFrames.push(0);
      errsMs.push(0);
    }
  }

  const half = Math.floor(errsMs.length / 2);
  return {
    samples: samples.length,
    evaluated: evalSamples.length,
    anchored: anchorT !== null,
    mismatchRate: evalSamples.length ? errsMs.filter(x => x > 0).length / evalSamples.length : null,
    meanAbsErrMs: mean(errsMs),
    p95AbsErrMs: pct(errsMs, 0.95),
    maxAbsErrMs: errsMs.length ? Math.max(...errsMs) : 0,
    meanAbsErrFrames: mean(errsFrames),
    firstHalfMeanErrMs: mean(errsMs.slice(0, half)),
    secondHalfMeanErrMs: mean(errsMs.slice(half)),
    observedCycleMs: mean(cycleDurations),
    observedCycleCount: cycleDurations.length,
    cycleDriftMs: cycleDurations.length
      ? mean(cycleDurations) - NOMINAL_CYCLE : null,
  };
}

/* ------------------------- 实验 B：帧锚定自绘 ------------------------- */

/**
 * 现实场景：页面加载后 GIF 无声自播；用户点击后解锁音频。
 * 这里刻意先无声播放 1.3 秒再解锁，检验「热切入」是否仍然对齐。
 */
async function runCanvasTrial(durMs, player) {
  const g = player.canvas.getContext('2d', { willReadFrequently: true });

  const switchLatency = [];   // 帧切换相对理想边界的滞后（ms）
  const rafIntervals = [];
  let lastRaf = 0;
  let rendererMismatch = 0;
  let checked = 0;

  let hotJoin = null;
  let hotJoinResolve;
  const hotJoinDone = new Promise(r => { hotJoinResolve = r; });

  player.setVolume(0); // 先静音自播
  await player.play();

  player.onFrame((f, pos, perfNow) => {
    switchLatency.push(pos - FRAME_STARTS[f]);
    if (lastRaf) rafIntervals.push(perfNow - lastRaf);
    lastRaf = perfNow;
  });

  const t0 = performance.now();

  // 1.3 秒后解锁音频 —— 模拟用户点击
  setTimeout(async () => {
    const beforeFrame = player.currentFrame();
    const beforePos = player.positionMs();
    await player.unlockAudio();
    const afterFrame = player.currentFrame();
    const afterPos = player.positionMs();
    const off = player.stats.audioOffsetMs;
    const fs = FRAME_STARTS[afterFrame];
    const fe = fs + player.manifest.frames[afterFrame];
    hotJoin = {
      frameBefore: beforeFrame,
      frameAfter: afterFrame,
      posBefore: beforePos,
      posAfter: afterPos,
      audioOffsetMs: off,
      frameWindowStart: fs,
      frameWindowEnd: fe,
      offsetInFrame: off >= fs && off < fe,
      schedulingErrorMs: player.stats.schedulingErrorMs,
    };
    player.setVolume(1);
    hotJoinResolve();
  }, 1300);

  await new Promise(resolve => {
    const step = () => {
      const t = performance.now() - t0;
      const lf = player.lastFrame;
      if (lf >= 0) {
        const bc = readBarcode(g);
        checked++;
        if (bc !== lf) rendererMismatch++;
      }
      if (t < durMs) requestAnimationFrame(step); else resolve();
    };
    requestAnimationFrame(step);
  });

  player.pause();
  await Promise.race([hotJoinDone, new Promise(r => setTimeout(r, 0))]);

  return {
    switchSamples: switchLatency.length,
    switchLatencyMeanMs: mean(switchLatency),
    switchLatencyP95Ms: pct(switchLatency, 0.95),
    switchLatencyMaxMs: Math.max(0, ...switchLatency),
    rafIntervalMeanMs: mean(rafIntervals),
    rafIntervalP95Ms: pct(rafIntervals, 0.95),
    rendererChecked: checked,
    rendererMismatch,
    hotJoin,
  };
}

/* ------------------------------ 主流程 ------------------------------ */

async function run() {
  $('run').disabled = true;
  const log = m => { $('log').textContent = m; };

  try {
    log('实验 A：原生播放器 + 延迟模型估计…');
    const A = await runNativeTrial(DUR);

    log('实验 B：帧锚定自绘 + 热切入…');
    const player = new FrameAudPlayer($('playerCanvas'), { mode: 'canvas' });
    await player.load(GIF_URL);
    const B = await runCanvasTrial(DUR, player);

    const result = {
      meta: {
        durationMs: DUR,
        nominalCycleMs: NOMINAL_CYCLE,
        frames: DELAYS.length,
        delaysMs: DELAYS,
        ua: navigator.userAgent,
      },
      nativeWithDelayModel: A,
      frameAnchoredCanvas: B,
    };

    renderTable(A, B);
    $('json').textContent = JSON.stringify(result, null, 2);
    window.__RESULT__ = result;
    log('完成。');
  } catch (e) {
    log('出错: ' + e.message);
    console.error(e);
    window.__RESULT__ = { error: e.message, stack: e.stack };
  } finally {
    $('run').disabled = false;
  }
}

function renderTable(A, B) {
  const hm = x => (x === null || x === undefined || Number.isNaN(x)) ? '—' : r2(x);
  const pctS = x => x === null ? '—' : (x * 100).toFixed(1) + '%';

  const rows = [
    ['帧级不一致率', pctS(A.mismatchRate), B.rendererMismatch !== undefined
      ? (B.rendererChecked ? pctS(B.rendererMismatch / B.rendererChecked) : '—') : '—'],
    ['平均绝对误差 (ms)', hm(A.meanAbsErrMs), '≈ 0（同源驱动，不产生帧错位）'],
    ['P95 绝对误差 (ms)', hm(A.p95AbsErrMs), '—'],
    ['最大绝对误差 (ms)', hm(A.maxAbsErrMs), '—'],
    ['误差趋势：前半段 / 后半段 (ms)', `${hm(A.firstHalfMeanErrMs)} / ${hm(A.secondHalfMeanErrMs)}`, '—'],
    ['实测周期 vs 标称 (ms)', `${hm(A.observedCycleMs)} vs ${NOMINAL_CYCLE}`, '—'],
    ['帧切换滞后 P95 (ms)', '—', hm(B.switchLatencyP95Ms)],
    ['帧切换滞后 最大 (ms)', '—', hm(B.switchLatencyMaxMs)],
    ['rAF 间隔 平均 / P95 (ms)', '—', `${hm(B.rafIntervalMeanMs)} / ${hm(B.rafIntervalP95Ms)}`],
    ['热切入落在当前帧窗口内', '—', B.hotJoin ? (B.hotJoin.offsetInFrame ? '是' : '否') : '—'],
    ['热切入音频偏移 (ms)', '—', B.hotJoin ? hm(B.hotJoin.audioOffsetMs) : '—'],
    ['热切入调度误差 (ms)', '—', B.hotJoin ? hm(B.hotJoin.schedulingErrorMs) : '—'],
  ];

  const tbody = document.querySelector('#resultTable tbody');
  tbody.innerHTML = rows.map(([k, a, b]) => {
    const cls = v => v === '是' ? 'pass' : v === '否' ? 'fail' : '';
    return `<tr><td>${k}</td><td class="num ${cls(String(a))}">${a}</td><td class="num ${cls(String(b))}">${b}</td></tr>`;
  }).join('');
}

$('run').addEventListener('click', run);
if (AUTO) setTimeout(run, 300);
</script>
</body>
</html>
