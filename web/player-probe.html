<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>player probe</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #c { display: block; width: 240px; height: 180px; image-rendering: pixelated; }
  #ticker { position: absolute; left: 0; top: 190px; width: 20px; height: 20px; }
  #go { position: absolute; left: 40px; top: 190px; }
</style>
</head>
<body>
<canvas id="c" width="240" height="180"></canvas>
<canvas id="ticker" width="20" height="20"></canvas>
<button id="go">go</button>
<button id="unlock" style="position:absolute;left:90px;top:190px">unlock</button>

<script type="module">
import { FrameAudPlayer } from './player.js';

// ?predict=22  启用呈现延迟补偿
const predictMs = Number(new URLSearchParams(location.search).get('predict') || 0);
const p = new FrameAudPlayer(document.getElementById('c'), { mode: 'canvas', predictMs });
window.__player = p;

await p.load('../assets/demo-audio.gif');
window.__ready = true;

// 供测量脚本按「截图时刻」查询播放器认为应该显示哪一帧
window.__probe = (epochMs) => {
  const pos = p.positionAtEpochMs(epochMs);
  return { pos, frame: p.frameAt(pos) };
};

// 批量版本：一次性把整批时刻交给页面，避免逐帧 evaluate 拖慢采集
window.__probeBatch = (epochs) => ({
  t0Epoch: performance.timeOrigin + p.t0,
  cycleMs: p.cycleMs,
  frameStartsMs: p.frameStarts,
  positions: epochs.map(e => p.positionAtEpochMs(e)),
  frames: epochs.map(e => p.frameAt(p.positionAtEpochMs(e))),
  stats: { ...p.stats },
  audioOffsetMs: p.stats.audioOffsetMs,
});

// 先无声播放（模拟页面加载后 GIF 就一直在动）
document.getElementById('go').addEventListener('click', async () => {
  p.setVolume(0);
  await p.play();
  window.__started = true;
});

// 用户点击后才解锁音频——真正的热切入
document.getElementById('unlock').addEventListener('click', async () => {
  const beforeFrame = p.currentFrame();
  const beforePos = p.positionMs();
  await p.unlockAudio();
  p.setVolume(1);
  const afterFrame = p.currentFrame();
  const off = p.stats.audioOffsetMs;
  const fs = p.frameStarts[afterFrame];
  const fe = fs + p.manifest.frames[afterFrame];
  window.__hotJoin = {
    frameBefore: beforeFrame,
    frameAfter: afterFrame,
    posBeforeMs: beforePos,
    posAfterMs: p.positionMs(),
    audioOffsetMs: off,
    frameWindowStart: fs,
    frameWindowEnd: fe,
    offsetInFrame: off >= fs && off < fe,
    schedulingErrorMs: p.stats.schedulingErrorMs,
  };
});

// 60fps ticker：强制合成器持续出帧，把截图采样率拉到刷新率
const tc = document.getElementById('ticker').getContext('2d');
let k = 0;
(function loop() {
  k = (k + 1) % 256;
  tc.fillStyle = `rgb(${k},0,0)`;
  tc.fillRect(0, 0, 20, 20);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
